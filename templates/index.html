<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>განწყობის მიხედვით მუსიკის რეკომენდერი</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .mood-btn { transition: all 0.3s; margin: 5px; }
        .mood-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,.1); }
        .song-card { transition: all 0.3s; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        .song-card:hover { transform: translateY(-5px); }
        .similarity-bar { height: 5px; border-radius: 3px; }
    </style>
</head>

<body>

<div class="container mt-4">
    <h1 class="text-center mb-4">🎵 განწყობის მიხედვით მუსიკის რეკომენდერი</h1>

    <div class="text-center mb-4">
        <button class="btn btn-warning mood-btn" data-mood="happy">ბედნიერი</button>
        <button class="btn btn-primary mood-btn" data-mood="sad">სევდიანი</button>
        <button class="btn btn-danger mood-btn" data-mood="energetic">ენერგიული</button>
    </div>

    <div id="loading" class="text-center" style="display:none;">
        <div class="spinner-border"></div>
    </div>

    <div id="recommendations" class="row"></div>

    {% if user.is_authenticated %}
    <div class="card mt-4">
        <div class="card-body text-center">
            <h5>📊 თქვენი სტატისტიკა</h5>
            <h3 id="songs-listened">0</h3>
            <p>მოსმენილი სიმღერები</p>
        </div>
    </div>
    {% endif %}
</div>

<script>
let currentMood = '';
let currentUserId = {% if user.is_authenticated %}{{ user.id }}{% else %}null{% endif %};

document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        currentMood = btn.dataset.mood;
        getRecommendations();
    });
});

async function getRecommendations() {
    document.getElementById('loading').style.display = 'block';
    const res = await fetch('/api/recommend/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({ mood: currentMood })
    });

    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    displayRecommendations(data.recommendations || []);
}

function displayRecommendations(recommendations) {
    const container = document.getElementById('recommendations');
    container.innerHTML = '';

    recommendations.forEach(song => {
        container.innerHTML += `
        <div class="col-md-4 mb-4">
            <div class="card song-card">
                <div class="card-body">
                    <h6>${song.title}</h6>
                    <p class="text-muted">${song.artist}</p>

                    <div class="d-flex justify-content-between">
                        ${song.youtube_link ? `
                        <a href="${song.youtube_link}" target="_blank"
                           class="btn btn-danger btn-sm"
                           onclick="recordPlay(${song.id})">
                           <i class="fab fa-youtube"></i> YouTube
                        </a>` : ''}

                        ${song.spotify_link ? `
                        <a href="${song.spotify_link}" target="_blank"
                           class="btn btn-success btn-sm"
                           onclick="recordPlay(${song.id})">
                           <i class="fab fa-spotify"></i> Spotify
                        </a>` : ''}
                    </div>
                </div>
            </div>
        </div>`;
    });
}

function recordPlay(songId) {
    if (!currentUserId) return;

    fetch('/api/play/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            song_id: songId,
            mood: currentMood
        })
    }).then(() => loadUserStats());
}

async function loadUserStats() {
    if (!currentUserId) return;
    const res = await fetch(`/api/user-stats/?user_id=${currentUserId}`);
    const data = await res.json();
    if (data.success) {
        document.getElementById('songs-listened').textContent =
            data.stats.songs_listened;
    }
}

function getCookie(name) {
    let value = null;
    document.cookie.split(';').forEach(c => {
        if (c.trim().startsWith(name + '=')) {
            value = decodeURIComponent(c.trim().substring(name.length + 1));
        }
    });
    return value;
}

{% if user.is_authenticated %}
document.addEventListener('DOMContentLoaded', loadUserStats);
{% endif %}
</script>

</body>
</html>
