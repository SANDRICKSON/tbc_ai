{% load static %}

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ლოგინი</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Body background gradient animation */
        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* Login box styling */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            transform: translateY(-50px);
            opacity: 0;
            animation: fadeInUp 1s forwards;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Logo */
        .login-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: rotateLogo 3s linear infinite;
        }

        @keyframes rotateLogo {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }

        h1 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #343a40;
        }

        /* Form fields */
        .form-control {
            border-radius: 10px;
            padding: 12px;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 10px rgba(111, 66, 193, 0.3);
        }

        /* Submit button */
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(111, 66, 193, 0.4);
        }

        /* Register link */
        .register-link {
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .register-link a {
            text-decoration: none;
            color: #6f42c1;
            font-weight: 500;
            transition: 0.3s;
        }
        .register-link a:hover {
            color: #343a40;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <img src="{% static 'tbc.png' %}" alt="TBC ლოგო" class="login-logo">

        <h1>🎵 შესვლა</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-login mt-2">შესვლა</button>
        </form>

        <div class="register-link">
            <p>ახალი მომხმარებელი? <a href="{% url 'register' %}">რეგისტრაცია</a></p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
